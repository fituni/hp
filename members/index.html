<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEMBERS | FiTNESS UNIVERSITY</title>
    <meta name="description" content="FiTNESS UNIVERSITYの運営メンバーをご紹介します。">

    <!-- Google Fonts: Modern Sans-Serif Unity -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@100;300;400;500;700&family=Noto+Sans+JP:wght@300;400;500;700&display=swap"
        rel="stylesheet">

    <style>
        :root {
            --color-sky-blue: #00A3E0;
            --color-sky-light: #E1F5FE;
            --color-sky-dark: #0077A8;
            --color-base-white: #FFFFFF;
            --color-soft-gray: #F8FAFC;
            --color-text-main: #1E293B;
            --color-text-sub: #475569;
            --font-main: 'Inter', 'Noto Sans JP', sans-serif;
            --transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        /* Base & Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: var(--font-main);
            background-color: var(--color-soft-gray);
            color: var(--color-text-main);
            line-height: 1.8;
            overflow-x: hidden;
            letter-spacing: 0.04em;
            -webkit-font-smoothing: antialiased;
        }

        /* Layout */
        .container {
            width: 90%;
            max-width: 1000px;
            margin: 0 auto;
        }

        .text-center {
            text-align: center;
        }

        .br-pc {
            display: block;
        }

        /* Navigation */
        nav {
            position: fixed;
            top: 0;
            width: 100%;
            height: 70px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 5%;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(8px);
            z-index: 1000;
            border-bottom: 1px solid rgba(0, 163, 224, 0.1);
        }

        .logo {
            font-weight: 700;
            font-size: clamp(0.9rem, 2vw, 1.1rem);
            letter-spacing: 0.1em;
            color: var(--color-sky-blue);
            text-decoration: none;
            cursor: pointer;
            z-index: 1001;
        }

        .nav-links {
            display: flex;
            gap: 30px;
            list-style: none;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--color-text-main);
            font-size: 0.9rem;
            font-weight: 700;
            transition: var(--transition);
            cursor: pointer;
        }

        .nav-links a:hover {
            color: var(--color-sky-blue);
        }

        /* Hamburger Menu Icon */
        .hamburger {
            display: none;
            flex-direction: column;
            justify-content: space-between;
            width: 24px;
            height: 18px;
            cursor: pointer;
            z-index: 1001;
        }

        .hamburger span {
            display: block;
            height: 2px;
            width: 100%;
            background-color: var(--color-sky-blue);
            border-radius: 2px;
            transition: var(--transition);
        }

        .hamburger.active span:nth-child(1) {
            transform: translateY(8px) rotate(45deg);
        }

        .hamburger.active span:nth-child(2) {
            opacity: 0;
        }

        .hamburger.active span:nth-child(3) {
            transform: translateY(-8px) rotate(-45deg);
        }

        /* Page Header */
        .page-header {
            padding: clamp(120px, 15vw, 160px) 0 clamp(60px, 8vw, 80px);
            background: var(--color-base-white);
            text-align: center;
            border-bottom: 1px solid #edf2f7;
        }

        .page-header-sub {
            font-size: clamp(0.75rem, 2vw, 0.85rem);
            letter-spacing: 0.3em;
            font-weight: 700;
            color: var(--color-sky-blue);
            margin-bottom: 1rem;
            display: block;
        }

        .page-header h1 {
            font-size: clamp(2rem, 5vw, 2.8rem);
            font-weight: 700;
            color: var(--color-text-main);
            line-height: 1.4;
            margin-bottom: 1.5rem;
        }

        .page-header p {
            font-size: clamp(0.95rem, 2.5vw, 1.05rem);
            color: var(--color-text-sub);
            max-width: 700px;
            margin: 0 auto;
            line-height: 1.9;
        }

        /* Members List Section */
        .members-section {
            padding: clamp(60px, 8vw, 100px) 0;
            min-height: 50vh;
        }

        .members-list {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: clamp(30px, 5vw, 40px);
        }

        /* Member Card Styles (Simplified) */
        .member-card {
            background: var(--color-base-white);
            border-radius: 12px;
            padding: clamp(40px, 5vw, 60px) 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.03);
            text-align: center;
            border-top: 4px solid var(--color-sky-blue);
            transition: var(--transition);
        }

        .member-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0, 163, 224, 0.1);
        }

        .member-photo {
            width: clamp(140px, 15vw, 160px);
            height: clamp(140px, 15vw, 160px);
            border-radius: 50%;
            background-color: #edf2f7;
            /* 画像がない場合のプレースホルダー色 */
            background-size: cover;
            background-position: center;
            margin: 0 auto 1.5rem;
            border: 4px solid var(--color-soft-gray);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.05);
        }

        .member-title {
            font-size: clamp(0.85rem, 2vw, 0.95rem);
            color: var(--color-sky-blue);
            font-weight: 700;
            display: block;
            margin-bottom: 0.5rem;
            line-height: 1.5;
        }

        .member-name {
            font-size: clamp(1.4rem, 3vw, 1.6rem);
            font-weight: 700;
            color: var(--color-text-main);
            margin-bottom: 0.2rem;
        }

        .member-name-en {
            font-size: clamp(0.8rem, 2vw, 0.9rem);
            color: var(--color-text-sub);
            letter-spacing: 0.05em;
            display: block;
        }

        /* Footer */
        footer {
            padding: 40px 0;
            background: var(--color-base-white);
            text-align: center;
            border-top: 1px solid #e2e8f0;
            margin-top: 40px;
        }

        .copyright {
            font-size: 0.85rem;
            color: var(--color-text-sub);
            font-weight: 500;
        }

        /* =========================================
           Responsive Design (Tablet & Mobile)
           ========================================= */
        @media (max-width: 968px) {
            .members-list {
                grid-template-columns: 1fr;
                max-width: 450px;
                margin: 0 auto;
            }
        }

        @media (max-width: 768px) {

            /* Mobile Nav */
            nav {
                height: 60px;
            }

            .hamburger {
                display: flex;
            }

            .nav-links {
                position: fixed;
                top: 0;
                right: -100%;
                width: 250px;
                height: 100vh;
                background: rgba(255, 255, 255, 0.98);
                flex-direction: column;
                justify-content: center;
                align-items: center;
                gap: 30px;
                transition: right 0.3s ease-in-out;
                box-shadow: -5px 0 15px rgba(0, 0, 0, 0.05);
                z-index: 1000;
            }

            .nav-links.active {
                right: 0;
            }

            .nav-links a {
                font-size: 1rem;
            }

            .menu-overlay {
                display: none;
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: rgba(0, 0, 0, 0.4);
                z-index: 999;
                opacity: 0;
                transition: opacity 0.3s ease;
            }

            .menu-overlay.active {
                display: block;
                opacity: 1;
            }

            .br-pc {
                display: inline;
            }
        }
    </style>
</head>

<body>

    <!-- Menu Overlay for Mobile -->
    <div class="menu-overlay" id="menu-overlay" onclick="closeMobileMenu()"></div>

    <nav>
        <a href="../index.html" class="logo">FiTNESS UNIVERSITY</a>
        <!-- Hamburger Icon for Mobile -->
        <div class="hamburger" id="hamburger" onclick="toggleMobileMenu()">
            <span></span>
            <span></span>
            <span></span>
        </div>
        <ul class="nav-links" id="nav-links">
            <li><a href="../index.html#about" onclick="closeMobileMenu();">理念・使命</a></li>
            <li><a href="../index.html#faculties" onclick="closeMobileMenu();">学部紹介</a></li>
            <li><a href="../index.html" onclick="closeMobileMenu();">Community (Unites)</a></li>
            <li><a href="index.html" onclick="closeMobileMenu();">メンバー</a></li>
        </ul>
    </nav>

    <!-- Page Header -->
    <header class="page-header">
        <div class="container">
            <span class="page-header-sub">MEMBERS</span>
            <h1>運営者の紹介</h1>
            <p>
                FiTNESS UNIVERSITYを牽引する運営メンバーをご紹介します。
            </p>
        </div>
    </header>

    <main class="members-section">
        <div class="container">
            <div class="members-list">

                <!-- ▼▼ 運営メンバー 1 ▼▼ -->
                <a href="yuta_okinaka/index.html" style="text-decoration: none; color: inherit;">
                    <article class="member-card">
                        <!-- 画像URLは後から実際の写真に差し替えてください -->
                        <div class="member-photo"
                            style="background-image: url('https://images.unsplash.com/photo-1560250097-0b93528c311a?auto=format&fit=crop&q=80&w=400');">
                        </div>
                        <span class="member-title">学長｜Founder</span>
                        <h3 class="member-name">沖中 由太</h3>
                        <span class="member-name-en">Yuta Okinaka</span>
                    </article>
                </a>

                <!-- ▼▼ 運営メンバー 2 ▼▼ -->
                <a href="hiroyuki_wakayama/index.html" style="text-decoration: none; color: inherit;">
                    <article class="member-card">
                        <div class="member-photo"
                            style="background-image: url('https://images.unsplash.com/photo-1573496359142-b8d87734a5a2?auto=format&fit=crop&q=80&w=400');">
                        </div>
                        <span class="member-title">健康経営事業部長</span>
                        <h3 class="member-name">若山 博行</h3>
                        <span class="member-name-en">Hiroyuki Wakayama</span>
                    </article>
                </a>

                <!-- ▼▼ 運営メンバー 3 ▼▼ -->
                <a href="tosei_kaneko/index.html" style="text-decoration: none; color: inherit;">
                    <article class="member-card">
                        <div class="member-photo"
                            style="background-image: url('https://images.unsplash.com/photo-1519085360753-af0119f7cbe7?auto=format&fit=crop&q=80&w=400');">
                        </div>
                        <span class="member-title">健康経営教育部長</span>
                        <h3 class="member-name">金子 東誠</h3>
                        <span class="member-name-en">Tosei Kaneko</span>
                    </article>
                </a>

            </div>
        </div>
    </main>

    <footer>
        <div class="container text-center">
            <div class="copyright">&copy; 2026 FiTNESS UNIVERSITY. ALL RIGHTS RESERVED.</div>
        </div>
    </footer>

    <script>
        /* Mobile Menu Setup */
        const hamburger = document.getElementById('hamburger');
        const navLinks = document.getElementById('nav-links');
        const menuOverlay = document.getElementById('menu-overlay');

        function toggleMobileMenu() {
            hamburger.classList.toggle('active');
            navLinks.classList.toggle('active');
            menuOverlay.classList.toggle('active');
        }

        function closeMobileMenu() {
            hamburger.classList.remove('active');
            navLinks.classList.remove('active');
            menuOverlay.classList.remove('active');
        }
    </script>
</body>

</html>
